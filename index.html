<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Routine</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--ink:#f2f3f5;--mut:#9aa1ad;--acc:#7cf0b4;--acc2:#2bb673;--bad:#ff7a7a;--warn:#ffd27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 84px)}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.t{font-weight:650;font-size:16px}
.h{color:var(--mut);font-size:13px;margin-top:2px}
.thumb{width:84px;height:112px;border-radius:10px;background:#0b0d11 center/cover no-repeat;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center}
button,.btn{appearance:none;border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:650;background:var(--acc);color:#06210f;cursor:pointer}
button.sec{background:#222731;color:var(--ink)}
button.bad{background:#3a1d1d;color:var(--bad)}
button.sm{padding:7px 11px;font-size:14px;border-radius:10px}
button:disabled{opacity:.4}
.done{color:var(--acc);font-size:13px;font-weight:650}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#12151b;border-top:1px solid var(--line);padding:5px 4px calc(env(safe-area-inset-bottom) + 5px);z-index:5}
nav button{flex:1;background:transparent;color:var(--mut);padding:9px 2px;font-size:12px;border-radius:10px}
nav button.on{color:var(--acc);background:#1a2420}
select,input[type=number],input[type=text]{width:100%;background:#0b0d11;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;background:#222731;color:var(--mut)}
.chip.ok{background:#16352a;color:var(--acc)}
.chip.no{background:#3a2a1d;color:var(--warn)}
.chip.dn{background:#1d2a3a;color:#8ec5ff}
.tick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#14171d;color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:11px 12px}
.tick .box{width:26px;height:26px;border-radius:8px;border:2px solid #3a404d;flex:none;display:flex;align-items:center;justify-content:center;color:#06210f;font-weight:900}
.tick.on{border-color:#25563f}
.tick.on .box{background:var(--acc);border-color:var(--acc)}
.tick .h{margin:0}
.chk{width:34px;height:34px;border-radius:10px;border:2px solid #3a404d;background:transparent;padding:0;flex:none;margin-right:10px}
.chk:active{background:#1a2420}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.mac > div{background:#14171d;border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center}
.mac b{display:block;font-size:15px}
.mac span{font-size:11px;color:var(--mut)}
.mac .fill{height:4px;border-radius:3px;background:#262a33;margin-top:5px;overflow:hidden}
.mac .fill i{display:block;height:100%;background:var(--acc)}
.mac .over i{background:var(--warn)}
.ing{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #20242c;font-size:15px}
.ing:last-child{border:0}
.ing .need{color:var(--bad)}
ol.st{margin:8px 0 8px 18px;padding:0}
ol.st li{margin:5px 0}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:#222731;color:var(--ink);padding:9px 4px;font-size:14px}
.seg button.on{background:var(--acc);color:#06210f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .g{aspect-ratio:3/4;background:#0b0d11 center/cover no-repeat;border-radius:10px;border:1px solid var(--line);position:relative}
.grid .g span{position:absolute;left:4px;bottom:4px;font-size:11px;background:#000a;padding:1px 6px;border-radius:6px}
.cmp{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#0b0d11;border:1px solid var(--line)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .top{clip-path:inset(0 50% 0 0)}
.cmp .line{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);left:50%}
.cmp .lab{position:absolute;top:8px;font-size:12px;background:#000a;padding:2px 8px;border-radius:8px}
.prompt{background:#0b0d11;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:#cfd3da;line-height:1.45;margin:6px 0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.wk div{text-align:center;background:#14171d;border:1px solid var(--line);border-radius:8px;padding:5px 0;font-size:12px}
.wk .y{background:#16352a;border-color:#25563f;color:var(--acc);font-weight:700}
.wk .today{outline:2px solid #3d6f57}
.sec-t{font-weight:700;margin:12px 0 4px;color:#cfd3da}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pics div{aspect-ratio:3/4;border-radius:12px;background:#0b0d11 center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;color:var(--mut);font-size:12px;text-align:center;padding:8px}
.pnum{display:inline-block;min-width:34px;font-weight:800;color:var(--acc)}
.price{font-family:ui-monospace,Menlo,Consolas,monospace;color:#d8b47a;font-size:14px;margin:10px 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.tile{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0d11;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:12px;padding:8px}
.tile.prod{background:#fff;padding:10px}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.man img{object-fit:cover}
.tile.man{padding:0}
.cap{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--mut);margin-top:4px}
.info{display:grid;grid-template-columns:92px 1fr;gap:10px 12px;background:#14171d;border-left:3px solid #8a6d45;border-radius:4px 12px 12px 4px;padding:14px;margin:12px 0}
.info .lab{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.12em;color:var(--mut);padding-top:2px}
button.ghost{background:transparent;color:#d8b47a;border:1.5px solid #8a6d45;padding:9px 14px}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.hide{display:none!important}
.note{color:var(--mut);font-size:13px}
.lnk{color:#8ec5ff;text-decoration:none;font-weight:650}
.sheetbg{position:fixed;inset:0;background:#000b;z-index:30;display:flex;align-items:flex-end}
.sheet{background:#161922;border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow:auto;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);border-top:1px solid var(--line)}
.toast{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 12px);background:#23412f;color:#d6ffe8;border:1px solid #2f6b4a;border-radius:12px;padding:11px 14px;z-index:40;font-weight:600}
.toast.err{background:#4a2323;border-color:#7a3a3a;color:#ffd6d6}
#cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#ghost{position:absolute;left:0;right:0;top:0;bottom:150px;width:100%;height:calc(100% - 150px);object-fit:cover;opacity:.35;pointer-events:none}
#camtop{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between}
#camtop button{background:#000a;color:#fff;padding:10px 14px}
#camctl{height:150px;background:#000;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 18px calc(env(safe-area-inset-bottom) + 8px)}
#shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #888;padding:0}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 2px 20px #000;pointer-events:none}
#viewer{position:fixed;inset:0;background:#000e;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#viewer img{max-width:100%;max-height:72vh;border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>

<nav id="nav">
  <button data-v="today" class="on">Today</button>
  <button data-v="meals">Meals</button>
  <button data-v="food">Food</button>
  <button data-v="areas">Areas</button>
  <button data-v="progress">Progress</button>
  <button data-v="more">More</button>
</nav>

<div id="cam" class="hide">
  <video id="vid" playsinline muted autoplay></video>
  <img id="ghost" alt="">
  <div id="camtop"><button id="camclose">Close</button><button id="camflip">Flip</button></div>
  <div id="count" class="hide"></div>
  <div id="camctl">
    <div class="row">
      <span class="note" style="color:#bbb">Ghost</span>
      <input type="range" id="gh" min="0" max="70" value="35">
      <select id="timer" style="width:92px"><option value="0">No timer</option><option value="3">3 s</option><option value="10" selected>10 s</option></select>
    </div>
    <div style="display:flex;justify-content:center"><button id="shutter" aria-label="Take photo"></button></div>
  </div>
</div>

<div id="viewer" class="hide"></div>
<div id="sheetroot"></div>
<div id="toast" class="toast hide"></div>
<input type="file" id="fallback" accept="image/*" capture class="hide">

<script src="foods.js"></script>
<script src="meals.js"></script>
<script src="areas.js"></script>
<script src="pics.js"></script>
<script src="app.js"></script>
</body>
</html>
